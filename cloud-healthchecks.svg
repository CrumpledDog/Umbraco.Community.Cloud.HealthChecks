<!-- Cloud.HealthChecks Badge (SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-labelledby="title desc" role="img">
  <title id="title">Cloud.HealthChecks Badge</title>
  <desc id="desc">Circular badge with a cloud and a medical cross centered inside.</desc>

  <defs>
    <!-- Clip the lower band to the circle so nothing bleeds -->
    <clipPath id="badgeClip">
      <circle cx="64" cy="64" r="57"/>
    </clipPath>
  </defs>

  <style>
    /* Palette — adjust to match your brand */
    .ring    { fill: #B5B6B6; }   /* outer grey ring */
    .badge   { fill: #C31630; }   /* main red field */
    .shadow  { fill: #93172D; }   /* darker lower segment */
    .icon    { fill: #5A101F; }   /* dark icon fill */
    .wstroke { stroke: #FFFFFF; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Outer ring -->
  <circle class="ring" cx="64" cy="64" r="63"/>

  <!-- Red badge field -->
  <circle class="badge" cx="64" cy="64" r="57"/>

  <!-- Lower dark segment (clipped) -->
  <g clip-path="url(#badgeClip)">
    <rect x="7" y="82" width="114" height="50" class="shadow"/>
  </g>

  <!-- Cloud + first-aid cross -->
  <g>
    <!-- Cloud body (dark fill + white outline) -->
    <path class="icon" d="M40,90c-9,0-16-7-16-16s7.4-15.5,16.3-15.9c1.2-9.3,9.1-16.6,18.7-16.6
                           8.1,0,15.1,5,17.8,12.1 1.1-.3,2.3-.4,3.5-.4 8.5,0,15.4,6.9,15.4,15.4S88.8,84,80.3,84H40z"/>
    <path class="wstroke" fill="none" d="M40,90c-9,0-16-7-16-16s7.4-15.5,16.3-15.9c1.2-9.3,9.1-16.6,18.7-16.6
                           8.1,0,15.1,5,17.8,12.1 1.1-.3,2.3-.4,3.5-.4 8.5,0,15.4,6.9,15.4,15.4S88.8,84,80.3,84H40z"/>

    <!-- First-aid cross (white stroke outline, dark fill background) -->
    <rect x="56" y="62" width="16" height="16" rx="2" ry="2" class="icon" />
    <path class="wstroke" fill="none"
          d="M64 58 v24 M52 70 h24"/>
  </g>

  <!-- Inner white rim -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="#FFFFFF" stroke-width="4"/>
</svg>
